PYTHON_ROOT_DIR_PATH=..
PYTHON_GENERATED_PACKAGE=matilda.generated

RESOURCES_SUBDIR=matilda/resources

VERSION=0.8.0

kspVersion=2.2.0-2.0.2
kotlinVersion=2.2.0
protobufVersion=4.28.3
protobufPluginVersion=0.9.4
pbandkVersion=0.16.1-SNAPSHOT
kotlinInjectVersion=0.8.1-SNAPSHOT
androidPluginVersion=8.11.1
daggerVersion=2.57

android.useAndroidX=true
kotlin.mpp.enableCInteropCommonization=true

# Gradle seems to require a larger metaspace size when run against this
# project. Otherwise, the build crashes with an out-of-memory error. Can be
# removed when/if this is resolved on the gradle side.
#
# Kotlin needs more heap space to build this project than the default 1GB.
org.gradle.jvmargs=-XX:MaxMetaspaceSize=512m -Xmx2g